<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para mi amor 💖</title>

<style>

body{
margin:0;
font-family:Arial;
background:white;
overflow:hidden;
}

/* 💗 corazones */
.corazones{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:0;
}

.corazon{
position:absolute;
bottom:-50px;
animation: subir 8s linear infinite;
opacity:0.7;
}

/* tamaños variados */
.corazon:nth-child(1){ font-size:10px; }
.corazon:nth-child(2){ font-size:14px; }
.corazon:nth-child(3){ font-size:12px; }
.corazon:nth-child(4){ font-size:16px; }
.corazon:nth-child(5){ font-size:11px; }
.corazon:nth-child(6){ font-size:13px; }

@keyframes subir{
0%{ transform:translateY(0) translateX(0); opacity:0; }
50%{ opacity:1; }
100%{ transform:translateY(-100vh) translateX(50px); opacity:0; }
}

/* menú */
.menu{
background:#ffe4ec;
padding:15px;
text-align:center;
position:relative;
z-index:2;
}

/* botones */
button{
background:#ffb6c1;
color:white;
border:none;
padding:12px 25px;
margin:5px;
border-radius:20px;
cursor:pointer;
transition:0.2s;
}

button:hover{
transform:scale(1.1);
}

button:active{
transform:scale(0.9);
}

/* contenido */
#contenido{
position:relative;
z-index:2;
padding:20px;
text-align:center;
}

/* galería */
.galeria{
display:flex;
flex-wrap:wrap;
justify-content:center;
}

.galeria img{
width:200px;
margin:10px;
border-radius:15px;
box-shadow:0px 5px 15px rgba(0,0,0,0.2);
transition:0.3s;
}

.galeria img:hover{
transform:scale(1.1);
}

</style>
</head>

<body>

<!-- 💗 corazones -->
<div class="corazones">
<span class="corazon" style="left:10%; animation-delay:0s;">💗</span>
<span class="corazon" style="left:30%; animation-delay:2s;">💕</span>
<span class="corazon" style="left:50%; animation-delay:4s;">💖</span>
<span class="corazon" style="left:70%; animation-delay:1s;">💞</span>
<span class="corazon" style="left:90%; animation-delay:3s;">💓</span>
<span class="corazon" style="left:20%; animation-delay:5s;">🤍</span>
</div>

<!-- 🔘 menú -->
<div class="menu">
<button onclick="mostrarInicio()">Inicio 💖</button>
<button onclick="mostrarMensaje()">Mensaje 💌</button>
<button onclick="mostrarGaleria()">Galería 📸</button>
</div>

<!-- contenido -->
<div id="contenido">
<h1>💖 Feliz cumpleaños mi amor 💖</h1>
<p>Te amo muchísimo 💕</p>
</div>

<!-- 🎵 música -->
<audio id="musica" loop style="display:none;">
<source src="audio/musica.mp3" type="audio/mpeg">
</audio>

<script>

/* iniciar música al primer clic */
document.addEventListener("click", function(){
document.getElementById("musica").play();
});

/* inicio */
function mostrarInicio(){
document.getElementById("contenido").innerHTML = `
<h1>💖 Feliz cumpleaños mi amor 💖</h1>
<p>Te amo muchísimo 💕</p>
`;
}

/* mensaje */
function mostrarMensaje(){
document.getElementById("contenido").innerHTML = `
<iframe src="mensaje.html" style="width:100%; height:70vh; border:none;"></iframe>
`;
}

/* galería */
function mostrarGaleria(){
document.getElementById("contenido").innerHTML = `
<h2>💖 Nuestras fotos 💖</h2>
<div class="galeria">
<img src="img/foto1.jpg">
<img src="img/foto2.jpg">
<img src="img/foto3.jpg">
</div>
`;
}

</script>

</body>
</html>
